replicas: 1

# Logstash pipeline configuration for receiving logs from Spring Boot microservices
logstashPipeline:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
    }

    filter {
      # Parse timestamp from logback
      if [@timestamp] {
        date {
          match => ["@timestamp", "ISO8601"]
          target => "@timestamp"
        }
      }

      # Extract traceId and spanId from MDC context
      if [traceId] {
        mutate {
          rename => { "traceId" => "trace_id" }
        }
      }

      if [spanId] {
        mutate {
          rename => { "spanId" => "span_id" }
        }
      }

      # Also check if they're in the mdc field
      if [mdc][traceId] {
        mutate {
          add_field => { "trace_id" => "%{[mdc][traceId]}" }
        }
      }

      if [mdc][spanId] {
        mutate {
          add_field => { "span_id" => "%{[mdc][spanId]}" }
        }
      }

      # Add tags based on service name
      if [service_name] {
        mutate {
          add_tag => ["microservice", "%{service_name}"]
        }
      }

      # Add a tag if trace_id exists for easier filtering
      if [trace_id] and [trace_id] != "-" {
        mutate {
          add_tag => ["traced"]
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["elasticsearch-master:9200"]
        index => "logstash-%{+YYYY.MM.dd}"
      }
      stdout {
        codec => rubydebug
      }
    }

# Expose port 5000 for TCP input from microservices
service:
  type: ClusterIP
  ports:
    - name: tcp-input
      port: 5000
      targetPort: 5000
      protocol: TCP

# Resource configuration
resources:
  requests:
    cpu: "100m"
    memory: "1536Mi"
  limits:
    cpu: "1000m"
    memory: "1536Mi"

# Java heap settings
logstashJavaOpts: "-Xmx1g -Xms1g"
