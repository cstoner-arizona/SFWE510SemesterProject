apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: skate-spots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      volumes:
        - name: realm-config-volume
          configMap:
            name: keycloak-config
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0
          args:
            - "start-dev"
            - "--import-realm"
          volumeMounts:
            - name: realm-config-volume
              mountPath: /opt/keycloak/data/import/realm.json
              subPath: realm.json
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: KC_PROXY
              value: "edge"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          resources:
            requests:
              memory: "1280Mi"
              cpu: "400m"
            limits:
              memory: "1536Mi"
              cpu: "800m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: skate-spots
spec:
  type: LoadBalancer
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
