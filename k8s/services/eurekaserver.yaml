apiVersion: apps/v1
kind: Deployment
metadata:
  name: eurekaserver
  namespace: skate-spots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eurekaserver
  template:
    metadata:
      labels:
        app: eurekaserver
    spec:
      containers:
      - name: eurekaserver
        image: 165787402199.dkr.ecr.us-east-1.amazonaws.com/skate-spots/eurekaserver:latest
        ports:
        - containerPort: 8070
        env:
        - name: PROFILE
          value: "k8s_dev"
        - name: PORT
          value: "8070"
        - name: CONFIGSERVER_URI
          value: "http://configserver:8089"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "eurekaserver"
        resources:
          requests:
            memory: "384Mi"
            cpu: "150m"
          limits:
            memory: "768Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8070
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8070
          initialDelaySeconds: 60
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eurekaserver
  namespace: skate-spots
spec:
  type: ClusterIP
  selector:
    app: eurekaserver
  ports:
  - port: 8070
    targetPort: 8070
    protocol: TCP
