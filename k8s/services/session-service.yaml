apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: skate-spots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      containers:
        - name: session-service
          image: 165787402199.dkr.ecr.us-east-1.amazonaws.com/skate-spots/session-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s-dev"
            - name: PORT
              value: "8082"
            - name: CONFIGSERVER_URI
              value: "http://configserver:8089"
            - name: REDIS_HOST
              value: "skate-spots-redis.8k8397.0001.use1.cache.amazonaws.com"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 240
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 120
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: skate-spots
spec:
  type: ClusterIP
  selector:
    app: session-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
