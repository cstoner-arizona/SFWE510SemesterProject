apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
  namespace: skate-spots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
      - name: configserver
        image: 165787402199.dkr.ecr.us-east-1.amazonaws.com/skate-spots/configserver:latest
        ports:
        - containerPort: 8089
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "native"
        - name: PORT
          value: "8089"
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8089
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: configserver
  namespace: skate-spots
spec:
  type: ClusterIP
  selector:
    app: configserver
  ports:
  - port: 8089
    targetPort: 8089
    protocol: TCP
