apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  namespace: skate-spots
data:
  init-skater.sql: |
    CREATE TABLE IF NOT EXISTS skaters (
        skater_id VARCHAR(36) PRIMARY KEY,
        username VARCHAR(100) NOT NULL UNIQUE,
        email VARCHAR(255) NOT NULL UNIQUE,
        display_name VARCHAR(100),
        bio VARCHAR(160),
        skill_level VARCHAR(20),
        stance VARCHAR(10),
        hometown VARCHAR(100),
        profile_photo_url VARCHAR(500),
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS tricks (
      skater_id VARCHAR(36) NOT NULL,
      trick_number INTEGER NOT NULL,
      name VARCHAR(100) NOT NULL,
      difficulty INTEGER CHECK (difficulty BETWEEN 1 AND 10),
      learned_at DATE,
      PRIMARY KEY (skater_id, trick_number),
      FOREIGN KEY (skater_id) REFERENCES skaters(skater_id) ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS trick_categories (
        skater_id VARCHAR(36) NOT NULL,
        trick_number INTEGER NOT NULL,
        category VARCHAR(50) NOT NULL,
        PRIMARY KEY (skater_id, trick_number, category),
        FOREIGN KEY (skater_id, trick_number) REFERENCES tricks(skater_id, trick_number) ON DELETE CASCADE
    );

    CREATE INDEX IF NOT EXISTS idx_skaters_username ON skaters(username);
    CREATE INDEX IF NOT EXISTS idx_tricks_skater_id ON tricks(skater_id);
    CREATE INDEX IF NOT EXISTS idx_trick_categories_skater_id ON trick_categories(skater_id);

  init-spot.sql: |
    CREATE TABLE IF NOT EXISTS spots (
       spot_id VARCHAR(36) PRIMARY KEY,
       name VARCHAR(255) NOT NULL,
       founder_skater_id VARCHAR(36) NOT NULL,
       address VARCHAR(500),
       latitude DECIMAL(10, 8),
       longitude DECIMAL(11, 8),
       difficulty_rating INTEGER CHECK (difficulty_rating BETWEEN 1 AND 10),
       surface_quality_rating INTEGER CHECK (surface_quality_rating BETWEEN 1 AND 10),
       description VARCHAR(2000),
       ideal_skate_time VARCHAR(100),
       created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
       updated_at TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS spot_types (
        spot_id VARCHAR(36) NOT NULL,
        type VARCHAR(50) NOT NULL,
        FOREIGN KEY (spot_id) REFERENCES spots(spot_id) ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS spot_photos (
         spot_id VARCHAR(36) NOT NULL,
         photo_url VARCHAR(500) NOT NULL,
         FOREIGN KEY (spot_id) REFERENCES spots(spot_id) ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS trick_attempts (
        id BIGSERIAL PRIMARY KEY,
        spot_id VARCHAR(36) NOT NULL,
        skater_id VARCHAR(36) NOT NULL,
        trick_name VARCHAR(255) NOT NULL,
        FOREIGN KEY (spot_id) REFERENCES spots(spot_id) ON DELETE CASCADE
    );

    CREATE INDEX IF NOT EXISTS idx_spots_founder_skater_id ON spots(founder_skater_id);
    CREATE INDEX IF NOT EXISTS idx_spot_types_spot_id ON spot_types(spot_id);
    CREATE INDEX IF NOT EXISTS idx_spot_photos_spot_id ON spot_photos(spot_id);
    CREATE INDEX IF NOT EXISTS idx_trick_attempts_skater_id ON trick_attempts(skater_id);
    CREATE INDEX IF NOT EXISTS idx_trick_attempts_spot_id ON trick_attempts(spot_id);

  init-session.sql: |
    CREATE TABLE IF NOT EXISTS sessions (
        session_id VARCHAR(36) PRIMARY KEY,
        skater_id VARCHAR(36) NOT NULL,
        spot_id VARCHAR(36) NOT NULL,
        start_time TIMESTAMP NOT NULL,
        end_time TIMESTAMP,
        notes VARCHAR(2000),
        weather VARCHAR(100),
        rating INTEGER CHECK (rating BETWEEN 1 AND 10),
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS session_tricks (
        session_id VARCHAR(36) NOT NULL,
        trick_number INTEGER NOT NULL,
        trick_name VARCHAR(100) NOT NULL,
        attempts INTEGER,
        lands INTEGER,
        is_new_trick BOOLEAN DEFAULT FALSE,
        notes VARCHAR(500),
        timestamp TIMESTAMP,
        PRIMARY KEY (session_id, trick_number),
        FOREIGN KEY (session_id) REFERENCES sessions(session_id) ON DELETE CASCADE
    );

    CREATE INDEX IF NOT EXISTS idx_sessions_skater_id ON sessions(skater_id);
    CREATE INDEX IF NOT EXISTS idx_sessions_spot_id ON sessions(spot_id);
    CREATE INDEX IF NOT EXISTS idx_sessions_tricks_session_id ON session_tricks(session_id);
