---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-data-loader
  namespace: skate-spots
spec:
  template:
    spec:
      containers:
      - name: postgres-client
        image: postgres:15
        command:
        - /bin/bash
        - -c
        - |
          echo "Creating skater database schema..."
          PGPASSWORD='SkaterDbPassword123!' psql -h skate-spots-skater-db.csrum6mwsrv3.us-east-1.rds.amazonaws.com -U postgres -d skater_dev -f /scripts/init-skater.sql

          echo "Loading skater data..."
          PGPASSWORD='SkaterDbPassword123!' psql -h skate-spots-skater-db.csrum6mwsrv3.us-east-1.rds.amazonaws.com -U postgres -d skater_dev -f /scripts/data-skater.sql

          echo "Creating spot database schema..."
          PGPASSWORD='SpotDbPassword123!' psql -h skate-spots-spot-db.csrum6mwsrv3.us-east-1.rds.amazonaws.com -U postgres -d spot_dev -f /scripts/init-spot.sql

          echo "Loading spot data..."
          PGPASSWORD='SpotDbPassword123!' psql -h skate-spots-spot-db.csrum6mwsrv3.us-east-1.rds.amazonaws.com -U postgres -d spot_dev -f /scripts/data-spot.sql

          echo "Creating session database schema..."
          PGPASSWORD='SessionDbPassword123!' psql -h skate-spots-session-db.csrum6mwsrv3.us-east-1.rds.amazonaws.com -U postgres -d session_dev -f /scripts/init-session.sql

          echo "Loading session data..."
          PGPASSWORD='SessionDbPassword123!' psql -h skate-spots-session-db.csrum6mwsrv3.us-east-1.rds.amazonaws.com -U postgres -d session_dev -f /scripts/data-session.sql

          echo "All schemas created and data loaded successfully!"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: db-init-scripts
      restartPolicy: Never
  backoffLimit: 3
