services:
  # --- DATABASES ---
  spot-database-dev:
    profiles: ["dev"]
    image: postgres:latest
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "spot_dev"
    volumes:
      - ./init-spot.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./data-spot.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      backend:
        aliases:
        - "spot-database"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  skater-database-dev:
    profiles: ["dev"]
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "skater_dev"
    volumes:
      - ./init-skater.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./data-skater.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      backend:
        aliases:
          - "skater-database"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  session-database-dev:
    profiles: ["dev"]
    image: postgres:latest
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "session_dev"
    volumes:
      - ./init-session.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./data-session.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      backend:
        aliases:
          - "session-database"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- CONFIGURATION SERVER ---
  configserver-dev:
    profiles: ["dev"]
    image: skate/configserver:0.0.1-SNAPSHOT
    ports:
    - "8089:8089"
    environment:
      PORT: "8089"
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: classpath:/config/
      ENCRYPT_KEY: "oK5wCXS4nADchiI9WEXYPdJrqeNhuzxeTFSwf1qo5ic=" # generated with: openssl rand -base64 32 TODO: move to .env file, then add to .gitignore
    networks:
      backend:
        aliases:
          - "configserver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # --- EUREKA SERVER ---
  eurekaserver-dev:
    profiles: ["dev"]
    image: skate/eurekaserver:0.0.1-SNAPSHOT
    ports:
      - "8070:8070"
    environment:
      PROFILE: dev
      CONFIGSERVER_URI: http://configserver:8089/
      PORT: "8070"
      EUREKA_INSTANCE_HOSTNAME: eurekaserver
    depends_on:
      configserver-dev:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - "eurekaserver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- GATEWAY SERVER ---
  gatewayserver-dev:
    profiles: ["dev"]
    image: skate/gatewayserver:0.0.1-SNAPSHOT
    ports:
      - "8072:8072"
    environment:
      PROFILE: dev
      CONFIGSERVER_URI: http://configserver:8089/
      PORT: "8072"
    depends_on:
      configserver-dev:
        condition: service_healthy
      eurekaserver-dev:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - "gatewayserver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8072/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=gatewayserver"

  # --- SPOT SERVICE ---
  spot-service-dev:
    profiles: ["dev"]
    image: skate/spot-service:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      PROFILE: dev
      CONFIGSERVER_URI: http://configserver:8089/
      PORT: "8080"
    depends_on:
      spot-database-dev:
        condition: service_healthy
      configserver-dev:
        condition: service_healthy
      eurekaserver-dev:
        condition: service_healthy
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=spot-service"

  # --- SKATER SERVICE ---
  skater-service-dev:
    profiles: ["dev"]
    image: skate/skater-service:0.0.1-SNAPSHOT
    ports:
      - "8081:8081"
    environment:
      PROFILE: dev
      CONFIGSERVER_URI: http://configserver:8089/
      PORT: "8081"
    depends_on:
      skater-database-dev:
        condition: service_healthy
      configserver-dev:
        condition: service_healthy
      eurekaserver-dev:
        condition: service_healthy
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=skater-service"

  # --- SESSION SERVICE ---
  session-service-dev:
    profiles: ["dev"]
    image: skate/session-service:0.0.1-SNAPSHOT
    ports:
      - "8082:8082"
    environment:
      PROFILE: dev
      CONFIGSERVER_URI: http://configserver:8089/
      PORT: "8082"
    depends_on:
      session-database-dev:
        condition: service_healthy
      configserver-dev:
        condition: service_healthy
      eurekaserver-dev:
        condition: service_healthy
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=session-service"

  # --- ELASTICSEARCH ---
  elasticsearch-dev:
    profiles: ["dev"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      backend:
        aliases:
          - "elasticsearch"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- LOGSTASH ---
  logstash-dev:
    profiles: ["dev"]
    image: docker.elastic.co/logstash/logstash:8.11.0
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch-dev:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - "logstash"

  # --- FILEBEAT ---
  # Disabled: Using logback-spring.xml in services to send logs directly to Logstash
  # filebeat-dev:
  #   profiles: ["dev"]
  #   image: docker.elastic.co/beats/filebeat:8.11.0
  #   user: root
  #   volumes:
  #     - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   command: filebeat -e -strict.perms=false
  #   depends_on:
  #     logstash-dev:
  #       condition: service_started
  #   networks:
  #     backend:
  #       aliases:
  #         - "filebeat"

  # --- KIBANA ---
  kibana-dev:
    profiles: ["dev"]
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch-dev:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - "kibana"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- ZIPKIN ---
  zipkin-dev:
    profiles: ["dev"]
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=elasticsearch
      - ES_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch-dev:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - "zipkin"

  # --- REDIS ---
  redis-dev:
    profiles: ["dev"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      backend:
        aliases:
          - "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  redis-data:
    driver: local
