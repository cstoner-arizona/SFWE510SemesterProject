input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse timestamp from logback
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add tags based on service name
  if [service_name] {
    mutate {
      add_tag => ["microservice", "%{service_name}"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
